<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polska moja ojczyzna</title>
</head>
<body>

    <!-- 1. Znacznik semantyczny: Nagłówek strony -->
    <header>
        <h1>Polska moja ojczyzna</h1>
    </header>

    <!-- 2. Znacznik semantyczny: Główna treść dokumentu (Wymagany tag main) -->
    <main>
        <p>To jest moja strona internetowa o Polsce</p>

        <!-- 3. Znacznik semantyczny: Sekcja tematyczna z listą -->
        <section>
            <h2>Co warto zobaczyć w Polsce;</h2>
            <ul>
                <li>Piękne Polskie Góry</li>
                <li>Morze Bałtyckie</li>
                <li>Zabytkowe Miasta</li>
                <li>Polska kultura</li>
            </ul>
        </section>

        <!-- Sekcja z obrazkami posiadającymi poprawne teksty alternatywne -->
        <img src="gory.jpg" alt="Gory">
        <img src="miasto.jpg" alt="Miasto">
        <img src="las.jpg" alt="Las">
    </main>

</body>
</html>
